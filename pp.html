<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Privacy Policy Redirect</title>

<script>
(function () {

  const lang = navigator.language || navigator.userLanguage;

  const supported = [
    "ar","ca","cs","da","de","el","en","es","fi","fr",
    "he","hi","hr","hu","id","it","ja","ko","ms","nb",
    "nl","pl","pt","ro","ru","sk","sv","th","tr","uk",
    "vi","zh-Hans","zh-Hant"
  ];

  function normalizeLocale(locale) {

    if (!locale) return "en";

    // zh-Hans / zh-Hant は例外
    if (locale === "zh-Hans" || locale === "zh-Hant") {
      return locale;
    }

    // 中国語の地域判定
    if (locale.startsWith("zh-TW") || locale.startsWith("zh-HK")) {
      return "zh-Hant";
    }

    if (locale.startsWith("zh")) {
      return "zh-Hans";
    }

    // 言語コードのみ抽出
    return locale.split("-")[0];
  }

  let code = normalizeLocale(lang);

  // 未対応なら default=en
  if (!supported.includes(code)) {
    code = "en";
  }

  window.location.replace(
    "pp_" + code + ".html"
  );

})();
</script>

</head>

<body>
Redirecting...
</body>
</html>
